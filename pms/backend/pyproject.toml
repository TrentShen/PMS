# pyproject.toml - PMS 后端包配置
# 使用 PEP 621 规范声明项目元数据与依赖
[project]
name = "pms-backend"
version = "0.9.0"
description = "Performance Management System - backend (FastAPI + SQLModel)"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Web 框架
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # ORM / 数据校验
    "sqlmodel>=0.0.22,<1.0",
    "pydantic-settings>=2.6,<3.0",
    # 数据库驱动
    "pymysql>=1.1,<2.0",
    "cryptography>=43,<51.0",
    # 迁移
    "alembic>=1.13,<2.0",
    # Redis
    "redis>=5.2,<9.0",
    # HTTP 客户端（调用企微 API）
    "httpx>=0.27,<1.0",
    # 表单解析（FastAPI UploadFile 依赖）
    "python-multipart>=0.0.12,<1.0",
    # 定时任务
    "apscheduler>=3.10,<4.0",
    # 鉴权
    "pyjwt>=2.9,<3.0",
    # 日志
    "loguru>=0.7,<1.0",
    # Excel 导入导出
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.7,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",
    "B008",  # FastAPI Depends/require_role 必须在参数默认值中调用
    "UP017", # datetime.UTC 别名建议；timezone.utc 在 py312 仍有效且更清晰
]
