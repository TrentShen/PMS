# 生产部署：全部容器化，一键 docker compose up -d --build
# 前置：1) 创建 .env.prod  2) HTTPS 证书放 ./certs/
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: pms-backend:latest
    container_name: pms-backend
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      # 容器默认 UTC，统一为上海时间，避免 date.today() 与 cron 口径偏移
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      # 镜像无 curl，用 python urllib 探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: pms-frontend:latest
    container_name: pms-frontend
    volumes:
      - web_dist:/output
    command: ["sh", "-c", "cp -r /dist/* /output/"]
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      - TZ=Asia/Shanghai
    # 不映射端口到宿主机：仅容器内网络访问（2026-08-10 确认无人直连 3307/6379 后回收）
    volumes:
      - pms_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pms-redis
    restart: unless-stopped
    # 不映射端口到宿主机：仅容器内网络访问
    volumes:
      - pms_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: pms-nginx
    restart: unless-stopped
    ports:
      # 30088 由宿主机系统 nginx 统一监听并提供 SSL，容器仅监听 80
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  pms_mysql_data:
  pms_redis_data:
  web_dist:
