# 捕获所有非生产域名的访问（如 http://10.222.4.38），
# 一律 301 到带 SSL 的域名入口，消除"非私密连接"警告。
# 公网入口 nginx 反代到本机 80 时会保留 Host 头（shanghai.idc.matrixorigin.cn），
# 因此命中下方正式 server 块，不会形成 301 死循环。
server {
    listen 80 default_server;
    server_name _;

    return 301 https://shanghai.idc.matrixorigin.cn:30088$request_uri;
}

server {
    listen 80;
    server_name shanghai.idc.matrixorigin.cn;

    # 公网入口 nginx 将 30088 反向代理到本机 80，
    # 因此 80 端口需要直接提供服务，不能再 301 回 30088，
    # 否则会与公网入口形成 301 死循环。
    client_max_body_size 20M;

    # 静态资源开启 gzip：3MB 的 JS bundle 压缩后约 900KB，
    # 公网入口带宽有限（实测未压缩下载 15s+），压缩后登录首屏显著提速
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;

    # 确保中文不乱码
    charset utf-8;
    charset_types text/xml text/plain text/css application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 安全响应头（不加 HSTS：灰度期域名可能变动）
    # CSP 宽松放行企微域名（企微 H5 需要），style 保留 unsafe-inline（antd 动态注入样式）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.qq.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.qq.com; connect-src 'self' https://*.qq.com; font-src 'self' data:" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        location = /index.html {
            # 嵌套 location 一旦有 add_header 就不再继承 server 级配置，需重复安全头
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.qq.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.qq.com; connect-src 'self' https://*.qq.com; font-src 'self' data:" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            # 同上：本块自带 add_header，安全头需重复声明
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.qq.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.qq.com; connect-src 'self' https://*.qq.com; font-src 'self' data:" always;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
    }

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_backend backend:8000;
        proxy_pass         http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location /health {
        set $upstream_health backend:8000;
        proxy_pass         http://$upstream_health/api/v1/health;
        proxy_http_version 1.1;
    }
}

